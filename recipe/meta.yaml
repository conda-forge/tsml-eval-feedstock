{% set name = "tsml-eval" %}
{% set version = "0.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 387b29f67d6e3990cbc88f199c18cc803508b993e9d24e293286a61dc00d2a5d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61
    - wheel
    - toml
    - python-build
    - pip
  run:
    - python >={{ python_min }},<3.13
    - aeon >=1.0.0,<1.1.0
    - tsml >=0.6.1,<0.7.0
    - scikit-learn >=1.0.0,<=1.7.0
    - matplotlib-base
    - seaborn
    - gpustat
    - psutil

test:
  imports:
    - tsml_eval
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/time-series-machine-learning/tsml-eval/
  dev_url: https://github.com/time-series-machine-learning/
  summary: A package for benchmarking time series machine learning tools.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - MatthewMiddlehurst
